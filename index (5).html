    if(dl){await dl.save({filename:fn,data:txt});toast('Copia guardada ✅');return}

function importBackup(inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const b=JSON.parse(r.result);
      if(!b||b.app!=='gym-amigas'||!Array.isArray(b.workouts)||!Array.isArray(b.routines))throw new Error('Este archivo no es una copia de esta app');
      const m=mine(),ids=new Set(m.workouts.map(w=>w.id));let nw=0,nr=0;
      b.workouts.forEach(w=>{if(w&&w.id&&w.ex&&Array.isArray(w.sets)&&!ids.has(w.id)){m.workouts.push(w);ids.add(w.id);nw++}});
      m.workouts.sort((a,b)=>a.d.localeCompare(b.d)||a.id.localeCompare(b.id));
      const names=new Set(m.routines.map(x=>x.n.toLowerCase()));
      b.routines.forEach(x=>{if(x&&x.n&&Array.isArray(x.ex)&&!names.has(x.n.toLowerCase())){m.routines.push(x);names.add(x.n.toLowerCase());nr++}});
      if(b.notes&&typeof b.notes==='object')m.notes=Object.assign({},b.notes,m.notes);
      if(b.base&&typeof b.base==='object')m.base=Object.assign({},b.base,m.base);
      if(!m.who&&b.who)m.who=b.who;
      persist(m);toast('Recuperado: '+nw+' ejercicios y '+nr+' rutinas');
    }catch(e){toast('No se pudo leer la copia: '+e.message)}
    inp.value='';
  };
  r.readAsText(f);
}
function importAll(inp){

    try{

      if(!db)throw new Error('Sin conexión con la nube');

        const src=b.docs[id],cur=JSON.parse(JSON.stringify(all[id]||{}));
        const d={workouts:cur.workouts||[],routines:cur.routines||[],who:src.who||cur.who||''};
        if(cur.notes)d.notes=cur.notes;if(cur.base)d.base=cur.base;
        const ids=new Set(d.workouts.map(w=>w.id));
        (src.workouts||[]).forEach(w=>{if(w&&w.id&&w.ex&&Array.isArray(w.sets)&&!ids.has(w.id)){d.workouts.push(w);ids.add(w.id);nw++}});
        d.workouts.sort((x,y)=>x.d.localeCompare(y.d)||String(x.id).localeCompare(String(y.id)));
        const names=new Set(d.routines.map(x=>x.n.toLowerCase()));
        (src.routines||[]).forEach(x=>{if(!(x&&x.n&&Array.isArray(x.ex)))return;const ex=d.routines.find(y=>y.n.toLowerCase()===x.n.toLowerCase());if(ex){if(x.s&&!ex.s)ex.s=true;return}d.routines.push(x);names.add(x.n.toLowerCase());nr++});
        if(src.notes)d.notes=Object.assign({},src.notes,d.notes||{});
        if(src.base)d.base=Object.assign({},src.base,d.base||{});
        all[id]=d;db.collection('logs').doc(id).set(d).catch(e=>toast('Error al subir '+id+': '+e.message));
      });
      render();toast('Subido: '+nw+' ejercicios y '+nr+' rutinas de todas');
    }catch(e){toast('No se pudo leer el archivo: '+e.message)}
    inp.value='';
  };

}

function chart(pts){

  const X=i=>pts.length===1?W/2:p+i*(W-2*p)/(pts.length-1),Y=v=>H-p-(v-mn)/r*(H-2*p);
  const line=pts.map((q,i)=>X(i)+','+Y(q.y)).join(' ');

   pts.map((q,i)=>`<circle cx="${X(i)}" cy="${Y(q.y)}" r="4" fill="var(--ac)"/><text x="${X(i)}" y="${Y(q.y)-8}" font-size="10" text-anchor="middle" fill="var(--tx)">${q.y}</text>`).join('')+
   `<text x="${p}" y="${H-6}" font-size="10" fill="var(--mut)">${fmtD(pts[0].d)}</text><text x="${W-p}" y="${H-6}" font-size="10" text-anchor="end" fill="var(--mut)">${fmtD(pts[pts.length-1].d)}</text></svg>`;
}

  let h='<h1>Progreso</h1><div class="row"><select onchange="setWho(this.value)"><option value="__all"'+(isAll?' selected':'')+'>👯 Todas</option>'+ids.map(i=>`<option value="${i}" ${i===sel.who?'selected':''}>${esc(nm(i))}</option>`).join('')+'</select>';
  h+=`<select onchange="setSelEx(this.value)">${exs.map(e=>`<option ${e===sel.ex?'selected':''}>${esc(e)}</option>`).join('')||'<option>—</option>'}</select></div>`;
  if(!sel.ex)return h+'<p class="mut">Aún no hay entrenos apuntados.</p>';
  const md=modeOf(pool,sel.ex);
  if(isAll){
    const order=ids.slice().sort((a,b)=>nm(a).localeCompare(nm(b)));
    const series=order.map((i,k)=>({i,name:nm(i),color:PAL[Math.min(k,PAL.length-1)],pts:metricByDay(dataOf(i).workouts,sel.ex,md)})).filter(x=>x.pts.length);
    h+='<div class="card"><div class="mut">'+mTitle(sel.ex,md)+' · '+esc(sel.ex)+'</div>'+chartMulti(series)+'<div class="chips" style="margin-top:8px">'+series.map(x=>`<span style="display:inline-flex;align-items:center;gap:6px;font-size:14px"><span style="width:12px;height:12px;border-radius:99px;background:${x.color};display:inline-block"></span>${esc(x.name)}</span>`).join('&nbsp;&nbsp;')+'</div></div>';
    h+=daysBlock(true,ids);
    h+='<h2>Récords</h2><div class="card">'+(series.map(x=>{const pr=Math.max(...x.pts.map(q=>q.y)),f=x.pts[0].y,l=x.pts[x.pts.length-1].y,dif=Math.round((l-f)*100)/100;return `<div class="item"><span><span style="color:${x.color}">●</span> <b>${esc(x.name)}</b></span><span>récord <span class="pr">${pr} ${unitOf(sel.ex,md)}</span> <span class="mut">· ${dif>0?'+':''}${dif} ${unitOf(sel.ex,md)} desde el inicio</span></span></div>`}).join('')||'<p class="mut">Sin datos.</p>')+'</div>';
    return h;
  }
  const ws=dataOf(sel.who).workouts;
  const pts=metricByDay(ws,sel.ex,md);
  const pr=Math.max(...pts.map(q=>q.y));
  h+=`<div class="card"><div class="mut">${mTitle(sel.ex,md)} · récord <span class="pr">${pr} ${unitOf(sel.ex,md)}</span></div>${chart(pts)}</div>`;
  h+=daysBlock(false,ids);
  h+='<h2>Historial</h2><div class="card">'+ws.filter(w=>w.ex===sel.ex).reverse().slice(0,12).map(w=>`<div class="item"><span>${fmtD(w.d)}</span><span>${w.sets.map(setTxt).join(' · ')}</span>${sel.who===myId?`<button class="ghost" style="padding:0 4px" onclick="editW('${w.id}')">${IC_E}</button>`:''}</div>`).join('')+'</div>';
  return h;
}

function vTeam(){
  const ids=Object.keys(all),wk=new Date(Date.now()-6*864e5),lim=wk.getFullYear()+'-'+String(wk.getMonth()+1).padStart(2,'0')+'-'+String(wk.getDate()).padStart(2,'0');
  let h='<h1>Las amigas</h1>';
  const liveNow=ids.filter(i=>{const l=dataOf(i).live;if(!l)return false;const age=Date.now()-l.ts;return age<120*6e4&&!(l.done>=l.total&&age>5*6e4)});
  if(liveNow.length){h+='<h2>🔥 Entrenando ahora</h2><div class="card">'+liveNow.map(i=>{const l=dataOf(i).live;return `<div class="item"><span><b>${esc(nm(i))}</b> · ${esc(l.n)} <span class="mut">· hace ${Math.max(0,Math.round((Date.now()-l.ts)/6e4))} min</span></span><b>${l.done}/${l.total}</b></div>`}).join('')+'</div>'}
  const td=today(),hoy=ids.map(i=>({i,ws:dataOf(i).workouts.filter(w=>w.d===td)})).filter(x=>x.ws.length);
  h+='<h2>Hoy</h2>'+(hoy.length?hoy.map(x=>`<div class="card"><b>${esc(nm(x.i))}</b>`+x.ws.map(w=>`<div class="item"><span>${esc(w.ex)}</span><span class="mut">${w.sets.map(setTxt).join(' · ')}</span></div>`).join('')+'</div>').join(''):'<p class="mut">Nadie ha apuntado nada hoy todavía.</p>');
  h+='<h2>Días entrenados (últimos 7 días)</h2><div class="card">';
  const rank=ids.map(i=>({i,n:new Set(dataOf(i).workouts.filter(w=>w.d>=lim).map(w=>w.d)).size})).sort((a,b)=>b.n-a.n);
  h+=rank.length?rank.map((r,k)=>`<div class="item"><span>${k===0&&r.n?'🏆 ':''}${esc(nm(r.i))}</span><b>${r.n}</b></div>`).join(''):'<p class="mut">Sin datos todavía.</p>';
  h+='</div><h2>Últimos entrenos</h2><div class="card">';
  const feed=[];ids.forEach(i=>dataOf(i).workouts.forEach(w=>feed.push({i,w})));
  feed.sort((a,b)=>b.w.d.localeCompare(a.w.d)||b.w.id.localeCompare(a.w.id));
  h+=feed.slice(0,20).map(f=>`<div class="item"><div><b>${esc(nm(f.i))}</b> · ${esc(f.w.ex)}<div class="mut">${f.w.sets.map(setTxt).join(' · ')}</div></div><span class="mut">${fmtD(f.w.d)}</span></div>`).join('')||'<p class="mut">Nada todavía.</p>';
  return h+'</div>';
}

function vRout(){
  const m=mine();
  let h='<h1>Mis rutinas</h1>';
  h+=m.routines.map((r,i)=>`<div class="card"><div class="item" style="border:0;padding:0"><b>${esc(r.n)}</b><span><button class="ghost" onclick="editRoutine(${i})">${IC_E}</button><button class="ghost" onclick="delRoutine(${i})">${IC_D}</button></span></div><div class="mut">${r.ex.map((e,i)=>esc(e)+((r.t||[])[i]?' ('+esc(r.t[i])+')':'')).join(' · ')}</div><div style="margin-top:8px"><button class="sec" onclick="togShare(${i})">${r.s?'👯 Compartida · dejar de compartir':'Compartir con las amigas'}</button></div></div>`).join('');
  h+=vShared();h+=vPlant(m);h+='<div class="card"><b>Copia de seguridad</b><div class="mut" style="margin:4px 0 8px">Descarga tus entrenos y rutinas en un archivo, por si acaso. Si algún día se pierden, súbelo aquí y se recuperan sin duplicar lo que ya tengas.</div><div class="row"><button class="sec" onclick="exportBackup()">⬇️ Descargar copia</button></div><div class="mut" style="margin:8px 0 4px">Recuperar desde un archivo:</div><input type="file" accept=".json,application/json" onchange="importBackup(this)"><div class="mut" style="margin:10px 0 4px">Subir el archivo de todas (solo para la mudanza):</div><input type="file" accept=".json,application/json" onchange="importAll(this)"></div>';h+='<div class="card"><b>'+(redit===null?'Nueva rutina':'Editando rutina')+'</b><div style="height:8px"></div><input id="rn" placeholder="Nombre (ej. Pierna)" value="'+esc(rname)+'" oninput="rname=this.value"><div style="height:8px"></div><div class="mut">Toca los ejercicios que lleva (se hacen en el orden en que los toques):</div>'+(rd.length?'<div style="margin:8px 0">'+rd.map((e,i)=>'<div class="row"><span style="flex:2"><b>'+(i+1)+'. '+esc(e)+'</b></span><input placeholder="3×10" value="'+esc(rt[e]||'')+'" oninput="rt[rd['+i+']]=this.value"><button class="ghost x" onclick="rd.splice('+i+',1);render()">✕</button></div>').join('')+'</div>':'')+'<div class="row" style="margin-top:8px"><input id="rfreein" placeholder="✍️ Ejercicio propio (ej. Caminata 20 min)" value="'+esc(rfree)+'" oninput="rfree=this.value" onkeydown="if(event.key===\'Enter\')addRFree()"><button class="sec" style="flex:0 0 auto" onclick="addRFree()">Añadir</button></div>'+exChips()+'<div style="height:8px"></div><div class="row"><button onclick="saveRoutine()">Guardar rutina</button>'+(redit!==null?'<button class="sec" onclick="cancelEdit()">Cancelar</button>':'')+'</div></div>';
  return h;
}

function render(){
  const act=document.activeElement&&document.activeElement.id;
  let h='';
  if(needName){$('#app').innerHTML='<h1>Gym con las amigas</h1><div class="card"><b>¿Quién eres?</b><div class="mut" style="margin:4px 0 8px">Elige tu nombre. Se queda guardado en este móvil. Elige solo el tuyo: si eliges el de otra, escribirás en sus datos.</div><div class="chips">'+['ALI','CAMI','ANI'].map(n=>`<button class="chip" onclick="pickGuest('${n}')">${n}</button>`).join('')+'</div></div><p class="mut" style="font-size:12px">Detalle técnico: '+esc(diag)+'</p>';$('#nav').innerHTML='';return}
  if(!loaded&&db)h+='<p class="mut">Cargando…</p>';
  if(!db&&loaded!==undefined&&offline)h+=myId!=='local'?'<div class="warn">Sin conexión con la nube: lo que apuntes se guarda en este móvil y se subirá cuando abras la página con conexión.</div>':'<div class="warn"><b>No se puede conectar con la nube.</b> Lo que apuntes se guarda en este móvil y se subirá cuando haya conexión.<div style="font-size:12px;margin-top:8px;opacity:.85">Detalle técnico: '+esc(diag||'ninguno')+'</div></div>';
  if(db&&(!online||pending))h+='<div class="warn">'+(pending&&pErr==='invalid_argument'?'⛔ <b>No se puede guardar en la nube</b>. Lo que apuntes se queda solo en este móvil. Avisa a Ana.':pending?'⏳ Cambios pendientes de subir. Seguís apuntando: se guarda en tu móvil y se sube solo al volver la conexión.':'Sin conexión: seguís apuntando, se guarda en tu móvil y se sube solo al volver.')+'</div>';
  try{h+={log:vLog,prog:vProg,team:vTeam,rout:vRout}[tab]()}catch(e){lastErr=e.message;h+='<div class="warn">Error al mostrar la pantalla: '+esc(e.message)+'</div>'}
  let nr=0;try{nr=mine().routines.length}catch(e){}
  h+='<p class="mut" style="font-size:12px;margin-top:24px">v59 · '+(db?(pending?'pendiente de subir':'en línea'):'sin conexión')+' · tus rutinas: '+nr+(lastErr?' · error: '+esc(lastErr):'')+'</p>';
  $('#app').innerHTML=h;
  const T=[['log','✏️','Apuntar'],['prog','📈','Progreso'],['team','👯','Amigas'],['rout','📋','Rutinas']];
  $('#nav').innerHTML=T.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="setTab('${t[0]}')"><span>${t[1]}</span>${t[2]}</button>`).join('');
  if(act){const e=document.getElementById(act);if(e)e.focus()}
}

(async()=>{
  await 0;
  try{firebase.initializeApp(FIREBASE_CONFIG);db=firebase.firestore()}catch(e){diag+='error al conectar: '+(e&&e.message||e)+'; '}
  let gname=null;
  try{gname=localStorage.getItem(LS+'name')}catch(e){}
  if(!db){offline=true;loaded=true;let li=null;try{li=localStorage.getItem(LS+'lastid')}catch(e){}if(li){myId=li;const l=lsGet();if(l&&l.data)all[myId]=l.data;pending=!!(l&&l.unsynced)}render();return}
  if(!gname){needName=true;loaded=true;render();return}
  startData('n_'+gname,gname);
})();
let guestName=null,needName=false,whoSet=false,liveCleared=false;
setInterval(()=>{try{if(sess&&db&&!document.hidden&&!(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)))setLive()}catch(e){}},5*6e4);
window.addEventListener('pagehide',()=>{try{if(db&&all[myId]&&all[myId].live){const m=mine();m.live=null;persist(m)}}catch(e){}});
function pickGuest(n){try{localStorage.setItem(LS+'name',n)}catch(e){}needName=false;loaded=false;startData('n_'+n,n)}
function startData(id,gname){
  myId=id;guestName=gname||null;render();
  setTimeout(()=>{if(!loaded){loaded=true;render()}},10000);
  db.collection('exercises').onSnapshot(s=>{cat={};s.docs.forEach(d=>{cat[d.id]=JSON.parse(JSON.stringify(d.data()||{}))});render()},()=>{});
  db.collection('logs').onSnapshot(async snap=>{
    all={};snap.docs.forEach(d=>{all[d.id]=JSON.parse(JSON.stringify(d.data()||{}))});
    const lc=lsGet();if(lc&&lc.unsynced){all[myId]=lc.data;pending=true;flush()}else if(all[myId])lsSet({data:all[myId],unsynced:false});try{localStorage.setItem(LS+'lastid',myId)}catch(e){}
    if(guestName&&!whoSet&&((all[myId]||{}).who!==guestName)){whoSet=true;const m=mine();m.who=guestName;persist(m)}
    const ids=Object.keys(all);if(!ids.includes(myId))ids.push(myId);
    try{const p=await user.profiles(ids);ids.forEach(i=>names[i]=(p[i]&&p[i].name)||'')}catch(e){}
    if(!liveCleared){liveCleared=true;if(all[myId]&&all[myId].live&&!sess){const mm=mine();mm.live=null;persist(mm);return}}
    loaded=true;render();
  },()=>{loaded=true;render()});
}
</script>
